# Run BGL through the pipeline with the v2 detector ensemble.
#
# BGL has two anomaly shapes simultaneously:
# - per-line: the first field is a ground-truth alert category (or `-`).
#   LabelAnomalyDetector honors this directly.
# - per-window: bursty traffic and shifting severity / node mix reveal
#   problems even when no individual line is alert-coded. WindowFeatureDetector
#   scores four engineered features; z_score/iqr/cusum keep the rate-only
#   baseline for comparison.

source:
  kind: file
  path: data/BGL/BGL.log

parser:
  kind: bgl

validation:
  - kind: schema
    require_message: true

template_matcher:
  enabled: false

sessionizer:
  enabled: false

detectors:
  # Per-line: trust the upstream classification embedded in column 1.
  - kind: label
    label_key: bgl_label
    normal_value: "-"

  # Per-window: feature-engineered unsupervised score over time buckets.
  - kind: window_features
    window_seconds: 60
    recent_window_history: 10
    alert_density_threshold: 0.05
    entropy_threshold: 1.5
    novelty_threshold: 0.30
    weight_alert: 0.5
    weight_entropy: 0.15
    weight_node: 0.15
    weight_novelty: 0.20
    score_threshold: 0.5

  # Original rate-only point detectors. Their F1 stays low — that's the
  # "wrong feature, not wrong detector" finding.
  - kind: z_score
    metric_key: metric
    threshold: 3.0
    window_size: 200
    min_samples: 50
  - kind: iqr
    metric_key: metric
    k: 1.5
    window_size: 200
    min_samples: 50
  - kind: cusum
    metric_key: metric
    threshold: 5.0
    slack: 0.5
    warmup_samples: 50

repository:
  kind: memory

runtime:
  num_workers: 4
  queue_size: 1000
  batch_size: 100
  flush_interval_s: 1.0
